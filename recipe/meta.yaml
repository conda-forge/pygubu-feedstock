{% set name = "pygubu" %}
{% set version = "0.42" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pygubu-{{ version }}.tar.gz
  sha256: acfb394f18b7da9085804060d4226e049be5ab933646a2130b4941d2ad4bfcfb

build:
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - importlib-resources  # [py<39]
    - xorg-libx11  # [linux]

test:
  imports:
    - pygubu
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/pygubu/
  summary: A simple GUI builder for the python tkinter module
  dev_url: https://github.com/alejandroautalan/pygubu
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - alejandroautalan
